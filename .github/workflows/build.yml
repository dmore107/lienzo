name: Compilar

# Revisa que todo compile en cada cambio, en cualquier rama, o en un pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      WHISPER_DONT_GENERATE_BINDINGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Revisar el código Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::correctness
      - name: Guardar Cargo.lock resuelto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
