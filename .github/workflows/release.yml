name: Publicar versión

# Al subir una etiqueta vX.Y.Z se compila el instalador, se firma para el
# actualizador y se publica en GitHub Releases junto con latest.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      # bindgen genera los bindings de whisper.cpp para Windows con el LLVM del runner
      LIBCLANG_PATH: "C:/Program Files/LLVM/bin"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: La etiqueta coincide con la versión de tauri.conf.json
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión v$v de tauri.conf.json" }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lienzo ${{ github.ref_name }}
          releaseBody: Descarga el instalador `Lienzo_*_x64-setup.exe`. Si ya tienes Lienzo 0.2 o superior, se actualiza solo.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Versión portable (zip para descargar + exe firmado para actualizarse)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out/Lienzo/datos | Out-Null
          Copy-Item src-tauri/target/release/lienzo.exe out/Lienzo/Lienzo.exe
          $leeme = @(
            'Lienzo portable'
            ''
            'Esta carpeta guarda todo lo de Lienzo: portapapeles, imagenes, grabaciones,'
            'transcripciones y modelos. Mientras exista junto a Lienzo.exe, Lienzo no usa'
            'ninguna otra carpeta del equipo ni el registro de Windows.'
            ''
            'Para llevarlo a otro equipo o a una USB, copia la carpeta Lienzo completa.'
            'No borres esta carpeta: perderias tus datos.'
          )
          Set-Content out/Lienzo/datos/LEEME.txt -Encoding utf8 -Value $leeme
          Compress-Archive -Path out/Lienzo -DestinationPath "out/Lienzo_${v}_portable.zip"
          Copy-Item src-tauri/target/release/lienzo.exe "out/Lienzo_${v}_portable.exe"
          npx tauri signer sign "out/Lienzo_${v}_portable.exe"
          if (-not (Test-Path "out/Lienzo_${v}_portable.exe.sig")) { throw "No se generó la firma del portable" }
          gh release upload "v$v" "out/Lienzo_${v}_portable.zip" "out/Lienzo_${v}_portable.exe" "out/Lienzo_${v}_portable.exe.sig" --clobber
